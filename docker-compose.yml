services:
  init-storage:
    image: simple-view-app:latest
    user: root
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - "mkdir -p /persistent-data/database /persistent-data/media /persistent-data/thumbnails /persistent-data/backups /persistent-data/logs /persistent-data/cache /persistent-public && cp -a /var/www/html/public/. /persistent-public/ && chown -R 33:33 /persistent-data /persistent-public"
    volumes:
      - ./data:/persistent-data
      - public_assets:/persistent-public
    network_mode: "none"
    restart: "no"

  app:
    image: simple-view-app:latest
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database/database.sqlite
      SIMPLEVIEW_DATA_PATH: /data
      SIMPLEVIEW_ACCEL_REDIRECT: "true"
    volumes:
      - ./data:/data
      - ./.env:/var/www/html/.env:ro
      - public_assets:/var/www/html/public
    depends_on:
      init-storage:
        condition: service_completed_successfully
    networks: [simpleview]
    healthcheck:
      test: ["CMD", "php", "artisan", "simpleview:health-check", "--quiet-json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  web:
    image: simple-view-nginx:latest
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.coolify
    restart: unless-stopped
    ports:
      - "${SIMPLEVIEW_HTTP_PORT:-80}:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - ./data:/data:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      init-storage:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    networks: [simpleview]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: simple-view-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database/database.sqlite
      SIMPLEVIEW_DATA_PATH: /data
      SIMPLEVIEW_SKIP_BOOTSTRAP: "true"
    command: ["php", "artisan", "queue:work", "database", "--queue=media,default", "--sleep=1", "--tries=2", "--timeout=900", "--max-time=3600"]
    volumes:
      - ./data:/data
      - ./.env:/var/www/html/.env:ro
      - public_assets:/var/www/html/public
    depends_on:
      init-storage:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    networks: [simpleview]
    stop_grace_period: 30s
  scheduler:
    image: simple-view-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database/database.sqlite
      SIMPLEVIEW_DATA_PATH: /data
      SIMPLEVIEW_SKIP_BOOTSTRAP: "true"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./data:/data
      - ./.env:/var/www/html/.env:ro
      - public_assets:/var/www/html/public
    depends_on:
      init-storage:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    networks: [simpleview]
networks:
  simpleview:
    driver: bridge
volumes:
  public_assets:
