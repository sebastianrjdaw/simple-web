services:
  init-storage:
    image: simple-view-app:latest
    user: root
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - "mkdir -p /persistent-data /persistent-public && cp -a /var/www/html/public/. /persistent-public/ && chown -R 33:33 /persistent-data /persistent-public"
    volumes:
      - simpleview-data:/persistent-data
      - simpleview-public:/persistent-public
    restart: "no"

  app:
    image: simple-view-app:latest
    build:
      context: .
      dockerfile: docker/app/Dockerfile.coolify
    restart: unless-stopped
    environment: &simpleview-env
      APP_NAME: Simple View
      APP_ENV: production
      APP_KEY: "base64:${SERVICE_REALBASE64_32_APPKEY}"
      APP_DEBUG: "false"
      APP_URL: "https://sebassrv-1.tailca22e3.ts.net:7445"
      APP_TIMEZONE: Europe/Madrid
      APP_LOCALE: es
      APP_FALLBACK_LOCALE: es
      LOG_CHANNEL: stack
      LOG_STACK: daily
      LOG_LEVEL: warning
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database/database.sqlite
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      MAIL_MAILER: smtp
      MAIL_HOST: 100.111.21.85
      MAIL_PORT: "1025"
      MAIL_FROM_ADDRESS: simpleview@dev.local
      MAIL_FROM_NAME: Simple View
      SIMPLEVIEW_ADMIN_USERNAME: admin
      SIMPLEVIEW_ADMIN_EMAIL: admin@simpleview.local
      SIMPLEVIEW_ADMIN_PASSWORD: "${SERVICE_PASSWORD_64_ADMIN}"
      SIMPLEVIEW_FORCE_PASSWORD_CHANGE: "true"
      SIMPLEVIEW_DATA_PATH: /data
      SIMPLEVIEW_DISPLAY_KEY: main-display
      SIMPLEVIEW_STORAGE_RESERVE_GB: "15"
      SIMPLEVIEW_BACKUP_FREQUENCY_DAYS: "2"
      SIMPLEVIEW_BACKUP_TIME: "03:00"
      SIMPLEVIEW_BACKUP_RETENTION_COUNT: "7"
      SIMPLEVIEW_BACKUP_PATH: /data/backups
    volumes:
      - simpleview-data:/data
      - simpleview-public:/var/www/html/public
    depends_on:
      init-storage:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "artisan", "simpleview:health-check", "--quiet-json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    mem_limit: 768m

  web:
    image: simple-view-nginx:latest
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.coolify
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - simpleview-public:/var/www/html/public:ro
    depends_on:
      init-storage:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 128m

  scheduler:
    image: simple-view-app:latest
    restart: unless-stopped
    environment:
      <<: *simpleview-env
      SIMPLEVIEW_SKIP_BOOTSTRAP: "true"
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - simpleview-data:/data
      - simpleview-public:/var/www/html/public
    depends_on:
      init-storage:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    mem_limit: 512m

volumes:
  simpleview-data:
  simpleview-public:
